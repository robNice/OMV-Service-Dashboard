<!DOCTYPE html>
<html lang="{{__.html.lang}}">
<head>
    <meta charset="UTF-8">
    <title>{{__.admin.services.title}}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/assets/admin/admin.css?v={{VERSION}}">
</head>
<body>
<div id="i18n"
     data-save-label="{{__.admin.save.label}}"
     data-save-saving="{{__.admin.save.saving}}"
     data-save-saved="{{__.admin.save.saved}}"
     data-save-error="{{__.admin.save.error}}"
     data-image-reset="{{__.admin.image.deleteCustomImage}}"
     data-image-upload-error="{{__.admin.image.uploadError}}"
     data-image-source-custom="{{__.admin.image.sourceCustom}}"
     data-image-source-auto="{{__.admin.image.sourceAuto}}"
     data-image-source-default="{{__.admin.image.sourceDefault}}">
</div>
<div id="save-bar">
    <button id="save-services" class="primary" disabled>
        <span class="label">{{__.admin.save.label}}</span>
        <span class="spinner hidden"></span>
    </button>

    <span id="save-status"></span>
</div>
<div class="admin-page">

    <header class="admin-header">
        <h1>{{__.admin.services.title}}</h1>
        <nav class="admin-nav" aria-label="Admin">
            <div class="admin-nav-group">
                <a href="/admin/services" class="admin-nav-link admin-nav-link-current">
                    <span class="admin-nav-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none">
                            <rect x="3" y="4" width="8" height="7" rx="1.5"></rect>
                            <rect x="13" y="4" width="8" height="7" rx="1.5"></rect>
                            <rect x="3" y="13" width="8" height="7" rx="1.5"></rect>
                            <rect x="13" y="13" width="8" height="7" rx="1.5"></rect>
                        </svg>
                    </span>
                    <span>{{__.admin.services.title}}</span>
                </a>
                <a href="/admin/theme" class="admin-nav-link">
                    <span class="admin-nav-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M12 4.2C7.69 4.2 4.2 7.69 4.2 12C4.2 16.31 7.69 19.8 12 19.8C12.55 19.8 13 19.35 13 18.8C13 18.51 12.87 18.24 12.66 18.05C12.46 17.86 12.33 17.59 12.33 17.29C12.33 16.74 12.78 16.29 13.33 16.29H15.14C18.49 16.29 21.2 13.58 21.2 10.23C21.2 6.9 18.97 4.2 12 4.2Z"></path>
                            <circle cx="7.9" cy="11.2" r="1.1"></circle>
                            <circle cx="10.6" cy="8.2" r="1.1"></circle>
                            <circle cx="14.2" cy="8.7" r="1.1"></circle>
                            <circle cx="16.4" cy="12.1" r="1.1"></circle>
                        </svg>
                    </span>
                    <span>{{__.admin.theme.title}}</span>
                </a>
                <a href="/admin/config" class="admin-nav-link">
                    <span class="admin-nav-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M12 3L13.9 6.9L18 7.5L15 10.5L15.7 14.6L12 12.7L8.3 14.6L9 10.5L6 7.5L10.1 6.9L12 3Z"></path>
                        </svg>
                    </span>
                    <span>{{__.admin.config.title}}</span>
                </a>
                <a href="/admin/setpassword" class="admin-nav-link">
                    <span class="admin-nav-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none">
                            <rect x="5" y="11" width="14" height="10" rx="2"></rect>
                            <path d="M8 11V8C8 5.79 9.79 4 12 4C14.21 4 16 5.79 16 8V11"></path>
                            <circle cx="12" cy="16" r="1.2" fill="currentColor" stroke="none"></circle>
                        </svg>
                    </span>
                    <span>{{__.admin.password.title}}</span>
                </a>
            </div>
            <div class="admin-nav-group admin-nav-group-end">
                <a href="/admin/logout" class="admin-nav-link admin-nav-link-logout">
                    <span class="admin-nav-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M10 5H6C4.9 5 4 5.9 4 7V17C4 18.1 4.9 19 6 19H10"></path>
                            <path d="M14 16L20 12L14 8"></path>
                            <path d="M20 12H9"></path>
                        </svg>
                    </span>
                    <span>{{__.admin.logout}}</span>
                </a>
            </div>
        </nav>
    </header>

    <div id="services-editor"></div>

    <button id="add-section" class="secondary add-section-full">
        {{__.admin.services.addSection}}
    </button>

</div>

<div id="drop-indicator"></div>

<template id="tpl-section">
    <div class="section" draggable="true">
        <div class="section-header">
            <button data-action="toggle-section" class="collapse-toggle" title="{{__.admin.section.toggle}}">▼</button>

            <div>
                <label>{{__.admin.section.id}}</label>
                <input type="text" data-field="section-id">
            </div>

            <div>
                <label>{{__.admin.section.title}}</label>
                <input type="text" data-field="section-title">
            </div>
            <div class="image-field">
                <label>{{__.admin.section.cardimage}}</label>

                <div class="image-preview">
                    <img
                            data-preview="section-card"
                            alt=""
                            src=""
                            data-defaultimg=""
                    >
                    <span class="image-status" data-status="section-card"></span>
                </div>

                <input type="file"
                       accept="image/*"
                       data-upload="section-card">

                <button type="button"
                        class="secondary small"
                        data-action="reset-section-card">
                    {{__.admin.image.deleteCustomImage}}
                </button>
            </div>

            <div class="image-field">
                <label>{{__.admin.section.backgroundimage}}</label>

                <div class="image-preview">
                    <img data-preview="section-bg" alt="">
                    <span class="image-status" data-status="section-bg"></span>
                </div>

                <input type="file"
                       accept="image/*"
                       data-upload="section-bg">

                <button type="button"
                        class="secondary small"
                        data-action="reset-section-bg">
                    {{__.admin.image.deleteCustomImage}}
                </button>
            </div>


            <button class="danger" data-action="delete-section">
                {{__.admin.section.delete}}
            </button>
        </div>

        <div class="section-body">
            <div class="section-services"></div>
            <button class="secondary add" data-action="add-service">
                {{__.admin.section.addService}}
            </button>
        </div>
    </div>
</template>

<template id="tpl-service">
    <div class="service" draggable="true">
        <div>
            <label>{{__.admin.service.title}}</label>
            <input type="text" data-field="service-title">
        </div>

        <div>
            <label>{{__.admin.service.url}}</label>
            <input type="text" data-field="service-url">
        </div>

        <div class="image-field">
            <label>{{__.admin.service.cardimage}}</label>

            <div class="image-preview">
                <img data-preview="service-card" alt="">
                <span class="image-status" data-status="service-card"></span>
            </div>

            <input type="file"
                   accept="image/*"
                   data-upload="service-card">

            <button type="button"
                    class="secondary small"
                    data-action="reset-service-card">
                {{__.admin.image.deleteCustomImage}}
            </button>
        </div>


        <button class="danger" data-action="delete-service">
            {{__.admin.service.delete}}
        </button>
    </div>
</template>

<script src="/assets/admin/admin-services.js"></script>
{{ADMIN_META_FOOTER}}
</body>
</html>
