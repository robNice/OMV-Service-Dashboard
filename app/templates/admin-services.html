<!DOCTYPE html>
<html lang="{{__.html.lang}}">
<head>
    <meta charset="UTF-8">
    <title>{{__.admin.services.title}}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/assets/admin/admin.css?v={{VERSION}}">
</head>
<body>
<div id="i18n"
     data-save-label="{{__.admin.save.label}}"
     data-save-saving="{{__.admin.save.saving}}"
     data-save-saved="{{__.admin.save.saved}}"
     data-save-error="{{__.admin.save.error}}"
     data-image-reset="{{__.admin.image.deleteCustomImage}}"
     data-image-upload-error="{{__.admin.image.uploadError}}"
     data-image-source-custom="{{__.admin.image.sourceCustom}}"
     data-image-source-auto="{{__.admin.image.sourceAuto}}"
     data-image-source-default="{{__.admin.image.sourceDefault}}">
</div>
<div class="admin-page">

    <header class="admin-header">
        <h1>{{__.admin.services.title}}</h1>
        {{ADMIN_NAV}}
    </header>

    <div id="save-bar">
        <button id="save-services" class="primary" disabled>
            <span class="label">{{__.admin.save.label}}</span>
            <span class="spinner hidden"></span>
        </button>

        <span id="save-status"></span>
    </div>

    <div id="services-editor"></div>

    <button id="add-section" class="secondary add-section-full">
        {{__.admin.services.addSection}}
    </button>

</div>

<div id="drop-indicator"></div>

<template id="tpl-section">
    <div class="section" draggable="true">
        <div class="section-header">
            <button data-action="toggle-section" class="collapse-toggle" title="{{__.admin.section.toggle}}">▼</button>

            <div class="section-meta">
                <div class="section-field section-field-id">
                    <label>{{__.admin.section.id}}</label>
                    <input type="text" data-field="section-id">
                </div>

                <div class="section-field section-field-title">
                    <label>{{__.admin.section.title}}</label>
                    <input type="text" data-field="section-title">
                </div>
            </div>

            <div class="section-media-row">
                <div class="image-field">
                    <label>{{__.admin.section.cardimage}}</label>

                    <div class="image-preview">
                        <img
                            data-preview="section-card"
                            alt=""
                            src=""
                            data-defaultimg=""
                        >
                        <span class="image-status" data-status="section-card"></span>
                    </div>

                    <input type="file"
                           class="image-input"
                           accept="image/*"
                           data-upload="section-card">

                    <button type="button"
                            class="secondary small"
                            data-action="reset-section-card">
                        {{__.admin.image.deleteCustomImage}}
                    </button>
                </div>

                <div class="image-field">
                    <label>{{__.admin.section.backgroundimage}}</label>

                    <div class="image-preview">
                        <img data-preview="section-bg" alt="">
                        <span class="image-status" data-status="section-bg"></span>
                    </div>

                    <input type="file"
                           class="image-input"
                           accept="image/*"
                           data-upload="section-bg">

                    <button type="button"
                            class="secondary small"
                            data-action="reset-section-bg">
                        {{__.admin.image.deleteCustomImage}}
                    </button>
                </div>
            </div>


            <button class="danger icon-button section-delete" data-action="delete-section" title="{{__.admin.section.delete}}" aria-label="{{__.admin.section.delete}}">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M4 7H20"></path>
                    <path d="M9 7V5H15V7"></path>
                    <path d="M7 7L8 19H16L17 7"></path>
                    <path d="M10 11V16"></path>
                    <path d="M14 11V16"></path>
                </svg>
            </button>
        </div>

        <div class="section-body">
            <div class="section-services"></div>
            <button class="secondary add" data-action="add-service">
                {{__.admin.section.addService}}
            </button>
        </div>
    </div>
</template>

<template id="tpl-service">
    <div class="service" draggable="true">
        <div class="service-field service-field-title">
            <label>{{__.admin.service.title}}</label>
            <input type="text" data-field="service-title">
        </div>

        <div class="service-field service-field-url">
            <label>{{__.admin.service.url}}</label>
            <input type="text" data-field="service-url">
        </div>

        <div class="image-field service-image-field">
            <label>{{__.admin.service.cardimage}}</label>

            <div class="image-preview">
                <img data-preview="service-card" alt="">
                <span class="image-status" data-status="service-card"></span>
            </div>

            <input type="file"
                   class="image-input"
                   accept="image/*"
                   data-upload="service-card">

            <button type="button"
                    class="secondary small"
                    data-action="reset-service-card">
                {{__.admin.image.deleteCustomImage}}
            </button>
        </div>


        <button class="danger icon-button service-delete" data-action="delete-service" title="{{__.admin.service.delete}}" aria-label="{{__.admin.service.delete}}">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 7H20"></path>
                <path d="M9 7V5H15V7"></path>
                <path d="M7 7L8 19H16L17 7"></path>
                <path d="M10 11V16"></path>
                <path d="M14 11V16"></path>
            </svg>
        </button>
    </div>
</template>

<script src="/assets/admin/admin-session.js?v={{VERSION}}"></script>
<script src="/assets/admin/admin-services.js?v={{VERSION}}"></script>
{{ADMIN_META_FOOTER}}
</body>
</html>
