<!DOCTYPE html>
<html lang="{{__.html.lang}}">
<head>
    <meta charset="UTF-8">
    <title>{{__.admin.theme.title}}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/assets/admin/admin.css?v={{VERSION}}">
</head>
<body>
<div id="save-bar" class="admin-save-bar">
    <button id="theme-save" class="primary" disabled>
        <span class="label">{{__.admin.save.label}}</span>
        <span class="spinner hidden"></span>
    </button>
    <span id="theme-status" class="save-status"></span>
</div>
<div class="admin-page">

    <header class="admin-header">
        <div>
            <h1>{{__.admin.theme.title}}</h1>
            <p class="admin-subtitle">{{__.admin.theme.desc}}</p>
        </div>
        {{ADMIN_NAV}}
    </header>

    <section
        class="admin-panel"
        id="theme-settings"
        data-current-theme="{{THEME_ID}}"
        data-loading="{{__.admin.theme.loading}}"
        data-save-label="{{__.admin.save.label}}"
        data-save-saving="{{__.admin.save.saving}}"
        data-save-saved="{{__.admin.save.saved}}"
        data-save-error="{{__.admin.save.error}}"
        data-current-label="{{__.admin.theme.current}}"
        data-version-label="{{__.admin.theme.version}}"
        data-empty-label="{{__.admin.theme.empty}}"
        data-config-title="{{__.admin.theme.settings.title}}"
        data-config-empty="{{__.admin.theme.settings.empty}}"
        data-config-reset="{{__.admin.theme.settings.reset}}"
        data-config-no-description="{{__.admin.theme.settings.noDescription}}"
        data-settings-count-label="{{__.admin.theme.settings.count}}"
        data-modal-close-label="{{__.label.close}}">

        <div class="admin-panel-head">
            <div>
                <h2>{{__.admin.theme.available}}</h2>
                <p class="admin-panel-copy">{{__.admin.theme.hint}}</p>
            </div>
        </div>
        <div id="theme-list" class="theme-grid"></div>
    </section>

</div>

<div id="theme-config-modal" class="theme-modal hidden" aria-hidden="true">
    <div class="theme-modal-backdrop" data-modal-close></div>
    <div class="theme-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="theme-config-title">
        <div class="theme-settings-head theme-modal-head">
            <div>
                <h2 id="theme-config-title">{{__.admin.theme.settings.title}}</h2>
                <p id="theme-config-description" class="admin-panel-copy"></p>
            </div>
            <div class="theme-modal-actions">
                <button id="theme-reset" class="secondary" type="button">{{__.admin.theme.settings.reset}}</button>
                <button id="theme-modal-close" class="secondary" type="button">{{__.label.close}}</button>
            </div>
        </div>
        <div id="theme-config-empty" class="admin-subtitle hidden">{{__.admin.theme.settings.empty}}</div>
        <div id="theme-config-form" class="theme-config-form"></div>
    </div>
</div>

<script src="/assets/admin/admin-session.js?v={{VERSION}}"></script>
<script src="/assets/admin/admin-theme.js?v={{VERSION}}"></script>
{{ADMIN_META_FOOTER}}
</body>
</html>
