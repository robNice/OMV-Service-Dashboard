<!DOCTYPE html>
<html lang="{{__.html.lang}}">
<head>
    <meta charset="UTF-8">
    <title>{{__.admin.config.title}}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/assets/admin/admin.css?v={{VERSION}}">
</head>
<body>
<div id="save-bar" class="admin-save-bar">
    <button id="config-save" class="primary" disabled>
        <span class="label">{{__.admin.save.label}}</span>
        <span class="spinner hidden"></span>
    </button>
    <span id="config-status" class="save-status"></span>
</div>
<div class="admin-page">

    <header class="admin-header">
        <div>
            <h1>{{__.admin.config.title}}</h1>
            <p class="admin-subtitle">{{__.admin.config.desc}}</p>
        </div>
        {{ADMIN_NAV}}
    </header>

    <section
        class="admin-panel"
        id="config-settings"
        data-save-label="{{__.admin.save.label}}"
        data-save-saving="{{__.admin.save.saving}}"
        data-save-saved="{{__.admin.save.saved}}"
        data-save-error="{{__.admin.save.error}}"
        data-port-confirm-title="{{__.admin.config.portConfirmTitle}}"
        data-port-confirm-body="{{__.admin.config.portConfirmBody}}">

        <div class="admin-panel-head">
            <div>
                <h2>{{__.admin.config.sectionTitle}}</h2>
                <p class="admin-panel-copy">{{__.admin.config.hint}}</p>
            </div>
        </div>

        <div class="admin-form-grid admin-form-grid-single">
            <div class="field">
                <label for="config-title">{{__.admin.config.fields.title}}</label>
                <input id="config-title" type="text" autocomplete="off">
            </div>

            <div class="field">
                <label for="config-default-lang">{{__.admin.config.fields.defaultLang}}</label>
                <select id="config-default-lang"></select>
            </div>

            <div class="field">
                <label for="config-refresh-interval">{{__.admin.config.fields.infoDrawerRefreshInterval}}</label>
                <input id="config-refresh-interval" type="number" min="1" step="1">
            </div>

            <div class="field admin-field-span-2">
                <label for="config-port">{{__.admin.config.fields.port}}</label>
                <input id="config-port" type="number" min="1" max="65535" step="1">
                <p class="admin-field-note">{{__.admin.config.portHint}}</p>
            </div>

            <fieldset class="field admin-field-span-2">
                <legend>{{__.admin.config.fields.serviceLinkTarget}}</legend>
                <p class="admin-field-note">{{__.admin.config.fields.serviceLinkTargetHint}}</p>
                <div class="theme-setting-choice-group">
                    <label class="theme-setting-choice theme-setting-choice-chip">
                        <input id="config-service-link-target-new-tab" type="radio" name="config-service-link-target" value="new-tab">
                        <span class="theme-setting-choice-chip-surface">
                            <span class="theme-setting-choice-label">{{__.admin.config.options.serviceLinkTarget.newTab}}</span>
                        </span>
                    </label>
                    <label class="theme-setting-choice theme-setting-choice-chip">
                        <input id="config-service-link-target-same-tab" type="radio" name="config-service-link-target" value="same-tab">
                        <span class="theme-setting-choice-chip-surface">
                            <span class="theme-setting-choice-label">{{__.admin.config.options.serviceLinkTarget.sameTab}}</span>
                        </span>
                    </label>
                </div>
            </fieldset>
        </div>
    </section>

</div>

<script src="/assets/admin/admin-session.js?v={{VERSION}}"></script>
<script src="/assets/admin/admin-config.js?v={{VERSION}}"></script>
{{ADMIN_META_FOOTER}}
</body>
</html>
